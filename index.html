<style>
:root{--bg:#f4f5f7;--ink:#1d2330;--muted:#6b7280;--line:#e3e6eb;--accent:#13284b;--accent2:#1f5fbf;
 --grey:#8a93a3;--blue:#2563eb;--indigo:#4f46e5;--red:#c62828;--amber:#b7791f;--green:#2e7d32}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
header img{height:30px}
header h1{margin:0;font-size:17px;color:#fff}header .sub{font-size:12px;color:#b9c8dc}
main{padding:16px 20px 50px;max-width:1500px;margin:0 auto}
.banner{background:#fdf4e3;border:1px solid #f0d9a8;color:#6b4e12;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:#b8c2d1}.card.on{outline:2px solid var(--accent2)}.card h3{margin:0 0 4px;font-size:15px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef0f3;margin:8px 0}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;white-space:nowrap;background:#eef0f3;color:#444}
.st-NotSubmitted{background:#eef0f3;color:#555}.st-Submitted{background:#e8f0fe;color:var(--blue)}.st-Resubmitted{background:#eef0fe;color:var(--indigo)}
.st-Commented{background:#fdf4e3;color:var(--amber)}.st-Rejected{background:#fdecec;color:var(--red)}.st-ApprovalPending{background:#fff0e6;color:#d9480f;font-weight:600}.st-Approved{background:#e8f5e9;color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0 10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--grey);border-radius:8px;padding:6px 12px;cursor:pointer}
.kpi.on{outline:2px solid var(--accent2)}.kpi .n{font-size:19px;font-weight:600}.kpi .l{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:6px;min-width:280px;font:inherit}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f7f8fa;font-size:12px;white-space:nowrap}
tr.r:hover td{background:#f8fafc;cursor:pointer}
.doc{font-family:Consolas,monospace;font-size:12px;white-space:nowrap}
.file{font-size:11.5px;color:#444;word-break:break-all;max-width:330px}
.flag{color:var(--red);font-weight:600}
tr.hist td{background:#fafbfc;padding:4px 8px 10px 30px}
.hist table td,.hist table th{font-size:12px;padding:3px 8px;position:static}
.empty{padding:30px;text-align:center;color:var(--muted)}
#loginwrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;
 background:linear-gradient(135deg,#0b1a33 0%,#13284b 45%,#1f5fbf 120%)}
#loginwrap::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 70% -10%,rgba(47,125,225,.35),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(31,95,191,.3),transparent 55%)}
.loginbox{position:relative;background:rgba(255,255,255,.98);border-radius:16px;padding:32px 30px 26px;width:100%;max-width:380px;
 box-shadow:0 30px 70px rgba(0,0,0,.45);animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.loginbox .logo{text-align:center;margin:4px 0 8px}.loginbox .logo img{height:44px;max-width:100%}
.loginbox h2{margin:14px 0 2px;font-size:18px;color:var(--accent);text-align:center}
.loginbox p.s{margin:0 0 20px;text-align:center;color:var(--muted);font-size:12.5px}
.fld{position:relative;margin-bottom:14px}
.fld label{display:block;font-size:12px;color:#53607a;margin-bottom:5px;font-weight:600}
.fld input{width:100%;padding:11px 12px;border:1px solid #d3d9e3;border-radius:9px;font-size:14px;background:#fff;transition:border .15s,box-shadow .15s}
.fld input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(31,95,191,.15)}
.fld .eye{position:absolute;right:10px;top:31px;cursor:pointer;color:#8a93a3;font-size:12px;user-select:none}
.loginbtn{width:100%;padding:12px;border:0;border-radius:9px;background:linear-gradient(90deg,#13284b,#1f5fbf);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.loginbtn:hover{filter:brightness(1.08)}.loginbtn:disabled{opacity:.6;cursor:default}
.loginerr{background:#fdecec;color:#c62828;border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:14px;display:none}
.loginft{margin-top:18px;text-align:center;font-size:11px;color:#9aa4b5}
</style>

const _u8=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};

function togPw(){const i=document.getElementById("lp"),e=event.target;if(i.type==="password"){i.type="text";e.textContent="hide"}else{i.type="password";e.textContent="show"}}
async function doLogin(ev){ev&&ev.preventDefault();
  const u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,er=document.getElementById("lerr"),b=document.getElementById("lbtn");
  if(!u||!p){er.textContent="Enter username and password.";er.style.display="block";return}
  b.disabled=true;b.textContent="Checking…";er.style.display="none";
  let payload=null;try{payload=await tryLogin(LOCK,u,p)}catch(e){}
  if(!payload){er.textContent="Wrong username or password.";er.style.display="block";b.disabled=false;b.textContent="Sign in";document.getElementById("lp").select();return}
  MODE="secure";const w=document.getElementById("loginwrap");if(w)w.remove();afterData(payload);
}
async function init(){
  if(LOCK){MODE="secure";showLogin();return}
  let d;
  try{d=await get("data/jobs.json");MODE="static"}catch(e){d=await get("/api/view/jobs");MODE="local"}
  if(d.locked){MODE="secure";showLogin();return}
  afterData(d);
}
function afterData(d){
  JOBS=(d.jobs||[]).filter(j=>!j.error).sort(byName);
  DETAIL=d.detail||{};
  if(d.title){document.getElementById("ttl").textContent=d.title;document.title="Nexus – "+d.title}
  if(d.published_at)document.getElementById("sub").textContent="Read-only view · updated "+d.published_at.replace("T"," ");
  if(MODE==="local")document.getElementById("ban").innerHTML=`<div class="banner">Preview on a DT PC – this is how the published page looks to other departments.</div>`;
  drawJobs();
  const h=location.hash.slice(1);if(h&&JOBS.some(j=>j.id===h))openJob(h);else if(JOBS.length===1)openJob(JOBS[0].id);
}
function drawJobs(){
  document.getElementById("jobs").innerHTML=JOBS.map(j=>{const c=j.counts||{},t=j.total||0;return `<div class="card ${J&&J.id===j.id?"on":""}" onclick="openJob('${j.id}')">
    <h3>${esc(j.name)}</h3><div class="small muted">${t} documents${c["Approval Pending"]?` · <span class="flag">${c["Approval Pending"]} approval pending</span>`:""}</div>
    <div class="bar">${ST.map(s=>c[s]?`<div title="${s}: ${c[s]}" style="width:${100*c[s]/t}%;background:${COL[s]}"></div>`:"").join("")}</div>
    <div class="small">${ST.filter(s=>c[s]).map(s=>`<span class="pill ${cls(s)}">${c[s]} ${esc(s)}</span>`).join(" ")}</div></div>`}).join("")||`<div class="empty">No jobs published yet.</div>`;
}
async function openJob(id){location.hash=id;F="all";Q="";OPEN={};
  document.getElementById("job").innerHTML=`<div class="empty">Loading…</div>`;
  J=MODE==="secure"?DETAIL[id]:MODE==="static"?await get("data/job_"+id+".json"):await get("/api/view/job/"+id);drawJobs();drawJob()}
function drawJob(){
  const c=J.counts||{},k=(id,n,l,col)=>`<div class="kpi ${F===id?"on":""}" style="border-left-color:${col}" onclick="F='${id}';drawJob()"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  document.getElementById("job").innerHTML=`<h2 style="margin:22px 0 0">${esc(J.name)}</h2><div class="small muted">Status as of ${esc((J.updated_at||"").replace("T"," "))}</div>
   <div class="kpis">${k("all",J.total,"All documents","var(--accent2)")}${CARDS.map(([l,sts])=>k(l,cardN(c,sts),l,COL[sts[0]])).join("")}</div>
   <div class="toolbar"><input type="search" placeholder="Search document no., title or file name" value="${esc(Q)}" oninput="Q=this.value;drawRows()"><span class="small muted">Click a document to see all its submissions and client replies.</span></div>
   <div class="wrap"><table><thead><tr><th>#</th><th>Document No</th><th>Title</th><th>Status</th><th>Days</th><th>Rev</th><th>Last submitted</th><th>Last client reply</th></tr></thead><tbody id="rows"></tbody></table></div>`;
  drawRows();
}
function evCell(e){if(!e)return"";return `${dmy(e.date)} · R${esc(e.rev)} ${e.status?pill(e.status):""}${e.tn?`<div class="small muted">TN ${esc(e.tn)}</div>`:""}${e.file?`<div class="file">📄 ${esc(e.file)}</div>`:""}`}
function drawRows(){
  let rows=J.rows;
  if(F!=="all"){const cc=CARDS.find(x=>x[0]===F);const sts=cc?cc[1]:[F];rows=rows.filter(r=>sts.includes(r.status))}
  if(Q){const q=Q.toUpperCase();rows=rows.filter(r=>r.doc_no.toUpperCase().includes(q)||(r.title||"").toUpperCase().includes(q)||(r.history||[]).some(h=>(h.file||"").toUpperCase().includes(q)))}
  document.getElementById("rows").innerHTML=rows.map(r=>`<tr class="r" onclick="tog('${esc(r.doc_no)}')"><td class="muted">${r.sr}</td><td class="doc">${esc(r.doc_no)}</td><td>${esc(r.title)}</td>
   <td>${pill(r.status)}</td><td class="small" style="white-space:nowrap">${r.days!=null?`<span class="${r.flag?"flag":""}">${r.days}</span>/${r.due??"–"} d<div class="muted">${r.waiting==="Client"?"with client":r.waiting==="CISPL"?"with CISPL":""}</div>`:""}</td>
   <td>${r.latest_rev?"R"+esc(r.latest_rev):""}</td><td class="small">${evCell(r.last_sub)}</td><td class="small">${evCell(r.last_rec)}</td></tr>
   ${OPEN[r.doc_no]?`<tr class="hist"><td colspan="8"><table><thead><tr><th>Date</th><th>Rev</th><th>Status</th><th>Transmittal</th><th>File name</th></tr></thead><tbody>
     ${(r.history||[]).map(h=>`<tr><td>${dmy(h.date)}</td><td>R${esc(h.rev)}</td><td>${pill(h.status)}</td><td>${esc(h.tn||"")}</td><td class="file">${esc(h.file||"–")}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Nothing submitted yet.</td></tr>`}</tbody></table></td></tr>`:""}`).join("")||`<tr><td colspan="8" class="empty">No documents match.</td></tr>`;
}
function tog(d){OPEN[d]=!OPEN[d];drawRows()}
init().catch(e=>document.getElementById("jobs").innerHTML=`<div class="empty">Could not load the data (${esc(e.message)}).</div>`);
</script>
</body>
</html>
