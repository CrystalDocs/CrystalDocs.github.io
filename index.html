<style>
:root{--bg:#f4f5f7;--ink:#1d2330;--muted:#6b7280;--line:#e3e6eb;--accent:#13284b;--accent2:#1f5fbf;
 --grey:#8a93a3;--blue:#2563eb;--indigo:#4f46e5;--red:#c62828;--amber:#b7791f;--green:#2e7d32;--orange:#d9480f}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--accent);padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header img{height:30px}
header .who{margin-left:auto;color:#cdd8e8;font-size:12.5px;display:flex;gap:12px;align-items:center}
header .who b{color:#fff}
header a.lo{color:#cdd8e8;text-decoration:underline;cursor:pointer;font-size:12px}
.tabsbar{background:#0f2141;padding:0 20px;display:flex;gap:4px}
.tabsbar a{color:#b9c8dc;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;font-size:14px}
.tabsbar a.on{color:#fff;border-color:var(--accent2);font-weight:600}
.tabsbar a .cnt{background:var(--orange);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:5px}
main{padding:16px 20px 60px;max-width:1500px;margin:0 auto}
h2{margin:6px 0 2px}.sub{font-size:12px;color:var(--muted)}
.banner{background:#fdf4e3;border:1px solid #f0d9a8;color:#6b4e12;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.card:hover{border-color:#b8c2d1}.card.on{outline:2px solid var(--accent2)}.card h3{margin:0 0 4px;font-size:15px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#eef0f3;margin:8px 0}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;white-space:nowrap;background:#eef0f3;color:#444}
.st-NotSubmitted{background:#eef0f3;color:#555}.st-Submitted{background:#e8f0fe;color:var(--blue)}.st-Resubmitted{background:#eef0fe;color:var(--indigo)}
.st-Commented{background:#fdf4e3;color:var(--amber)}.st-Rejected{background:#fdecec;color:var(--red)}.st-ApprovalPending{background:#fff0e6;color:var(--orange);font-weight:600}.st-Approved{background:#e8f5e9;color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0 10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--grey);border-radius:8px;padding:6px 12px;cursor:pointer}
.kpi.on{outline:2px solid var(--accent2)}.kpi .n{font-size:19px;font-weight:600}.kpi .l{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
input[type=search]{padding:7px 10px;border:1px solid var(--line);border-radius:6px;min-width:260px;font:inherit}
.wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f7f8fa;font-size:12px;white-space:nowrap}
tr.r:hover td{background:#f8fafc;cursor:pointer}
.doc{font-family:Consolas,monospace;font-size:12px;white-space:nowrap}
.file{font-size:11.5px;color:#444;word-break:break-all;max-width:320px}
.flag{color:var(--red);font-weight:600}
tr.hist td{background:#fafbfc;padding:4px 8px 10px 30px}
.hist table td,.hist table th{font-size:12px;padding:3px 8px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.star{cursor:pointer;font-size:16px;color:#c7ccd4;user-select:none}.star.on{color:#f2b600}
.pin{cursor:pointer;font-size:15px;opacity:.28;filter:grayscale(1)}.pin.on{opacity:1;filter:none}
.mt{font-size:14.5px;font-weight:600;margin:6px 0 2px;line-height:1.35}.mdn{font-size:11.5px;color:#4b5563}
.mini{border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:inherit;font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--ink);font:inherit}
.btn:hover{border-color:#b8c2d1}.btn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}.btn.sm{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.savebar{position:sticky;top:0;z-index:5;background:#fffbe6;border:1px solid #f0d9a8;border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;font-size:13px}
.mwrow{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.mwrow.pinned{border-left:4px solid var(--accent2)}
.mwrow .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mwrow .doc{font-weight:600}
.note{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;margin-top:6px;resize:vertical}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.todo .box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.todo .box h4{margin:0 0 6px;font-size:13px}.todo .box .n{font-size:22px;font-weight:600}
.due-over{color:var(--red)}.due-soon{color:var(--orange)}
#toasts{position:fixed;bottom:16px;right:16px;left:auto;z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-width:calc(100% - 32px)}
.toast{background:#1d2330;color:#fff;padding:10px 14px;border-radius:8px;max-width:440px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}

.mwbtn{border:1px solid #c9d6ea;background:#f1f6fe;color:var(--accent2);border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.mwbtn:hover{background:#e3edfc}.mwbtn.on{background:var(--green);border-color:var(--green);color:#fff}
.sugg{font-size:12px;color:var(--accent2);cursor:pointer;text-decoration:underline}
.mwrow .doc{white-space:normal;word-break:break-all}
.dcards{display:none}
.dcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px}
.dcard .t{font-size:14.5px;font-weight:600;color:var(--ink);margin:5px 0 3px;line-height:1.35}
.dcard .dn{font-family:Consolas,monospace;font-size:11.5px;color:#4b5563;word-break:break-all}
.dcard .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.dcard .ev{font-size:12px;margin-top:6px;color:#374151}.dcard .ev b{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.dcard .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
@media (max-width:720px){
 header{padding:10px 14px;gap:10px}header img{height:22px}
 #ttl{font-size:14px!important}header .sub{font-size:11px}
 header .who{margin-left:0;width:100%;gap:8px}
 .todo .box{padding:8px 10px}.todo .box h4{font-size:12px;margin-bottom:2px}
 .savebar{flex-wrap:wrap;position:static}
 .tabsbar{padding:0 8px;overflow-x:auto}.tabsbar a{padding:10px 12px}
 main{padding:12px 12px 50px}
 .wrap{display:none}.dcards{display:block}
 .todo{grid-template-columns:repeat(2,minmax(0,1fr))}
 .todo .box .n{font-size:19px}
 input[type=search]{min-width:0;width:100%}
 .cards{grid-template-columns:1fr}
 h2{font-size:19px}
}
.badge{display:inline-block;background:#fff0e6;color:var(--orange);border:1px solid #ffd5bd;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;margin-top:7px}
.alerts{background:#fff7f0;border:1px solid #ffd5bd;border-radius:8px;padding:8px 12px;margin-bottom:12px}
.al{padding:5px 0;border-bottom:1px dashed #f3d4c0}.al:last-child{border-bottom:0}
/* login */
#loginwrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0b1a33 0%,#13284b 45%,#1f5fbf 120%)}
#loginwrap::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 500px at 70% -10%,rgba(47,125,225,.35),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(31,95,191,.3),transparent 55%)}
.loginbox{position:relative;background:rgba(255,255,255,.98);border-radius:16px;padding:32px 30px 26px;width:100%;max-width:380px;box-shadow:0 30px 70px rgba(0,0,0,.45);animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.loginbox .logo{text-align:center;margin:2px 0 6px}.loginbox .logo img{height:26px;max-width:100%}
.loginbox h2{margin:14px 0 2px;font-size:18px;color:var(--accent);text-align:center}
.loginbox p.s{margin:0 0 20px;text-align:center;color:var(--muted);font-size:12.5px}
.fld{position:relative;margin-bottom:14px}
.fld label{display:block;font-size:12px;color:#53607a;margin-bottom:5px;font-weight:600}
.fld input{width:100%;padding:11px 12px;border:1px solid #d3d9e3;border-radius:9px;font-size:14px;background:#fff}
.fld input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(31,95,191,.15)}
.fld .eye{position:absolute;right:10px;top:31px;cursor:pointer;color:#8a93a3;font-size:12px;user-select:none}
.loginbtn{width:100%;padding:12px;border:0;border-radius:9px;background:linear-gradient(90deg,#13284b,#1f5fbf);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.loginbtn:disabled{opacity:.6;cursor:default}
.loginerr{background:#fdecec;color:#c62828;border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:14px;display:none}
.loginft{margin-top:18px;text-align:center;font-size:11px;color:#9aa4b5}
</style>
</head>

const _te=s=>new TextEncoder().encode(s);
const _u8=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
function _cat(){let n=0;for(const x of arguments)n+=x.length;const o=new Uint8Array(n);let k=0;for(const x of arguments){o.set(x,k);k+=x.length}return o}
async function _hm(key,msg){const k=await crypto.subtle.importKey("raw",key,{name:"HMAC",hash:"SHA-256"},false,["sign"]);return new Uint8Array(await crypto.subtle.sign("HMAC",k,msg))}
async function _ks(ke,iv,n){const out=new Uint8Array(n);let c=0,off=0;while(off<n){const ctr=new Uint8Array(4);new DataView(ctr.buffer).setUint32(0,c,false);const blk=await _hm(ke,_cat(iv,ctr));for(let i=0;i<32&&off<n;i++)out[off++]=blk[i];c++}return out}
function _eq(a,b){if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0}
async function _dec(key,b64){const raw=_u8(b64),iv=raw.slice(0,16),tag=raw.slice(16,48),ct=raw.slice(48);
  const ke=await _hm(key,_te("enc")),ka=await _hm(key,_te("auth"));if(!_eq(tag,await _hm(ka,_cat(iv,ct))))return null;
  const s=await _ks(ke,iv,ct.length),pt=new Uint8Array(ct.length);for(let i=0;i<ct.length;i++)pt[i]=ct[i]^s[i];return pt}
async function _ukey(pw,user,salt,it){const base=await crypto.subtle.importKey("raw",_te(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:_cat(salt,_te(":"+user.toLowerCase())),iterations:it,hash:"SHA-256"},base,256);return new Uint8Array(bits)}
async function tryLogin(bundle,user,pw){const salt=_u8(bundle.salt),uk=await _ukey(pw,user,salt,bundle.it);
  for(const blob of bundle.keys){const dk=await _dec(uk,blob);if(dk){const pt=await _dec(dk,bundle.data);if(pt)return JSON.parse(new TextDecoder().decode(pt))}}return null}
async function hmacHex(saltB,msg){const d=await _hm(saltB,_te(msg));return Array.from(d).map(b=>b.toString(16).padStart(2,"0")).join("")}
let MODE="",EDIT=false,CANOPEN=false,CANONLINE=false,TOKEN="",USERNAME="";
let JOBS=[],DETAIL={},MYWORK={watch:{}},DIRTY=false,LASTSAVE=null,saveT=null;
let TAB="mywork",JF="all",JQ="",JOPEN={},curJob=null,MF="all",MQ="";
const hasMW=()=>MODE==="user"||MODE==="github";
const wkey=(j,d)=>j+"|"+d;
function liveDoc(jid,doc){const j=DETAIL[jid];if(!j)return null;return (j.rows||[]).find(r=>r.doc_no===doc)||null}
function jobName(jid){const j=JOBS.find(x=>x.id===jid);return j?j.name:jid}
async function post(u,b){b=Object.assign({t:TOKEN},b||{});const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.error||"error");return d}

// ---------------------------------------------------------------- context detect
async function init(){
  let ver=null;try{ver=await get("/api/version")}catch(e){}
  if(ver&&ver.user_mode){MODE="user";showLogin();return}
  if(ver){MODE="preview";try{bootData(await get("/api/view/jobs"));}catch(e){appErr(e)}return}
  if(LOCK){MODE="github";showLogin();return}
  try{const d=await get("data/jobs.json");if(d.locked){document.getElementById("app").innerHTML='<div class="empty">This page needs the Nexus app to open it.</div>';return}MODE="static";bootData(d);}catch(e){appErr(e)}
}
function appErr(e){document.getElementById("app").innerHTML=`<div class="empty">Could not load the data (${esc(e.message)}).</div>`}
function bootData(d){
  JOBS=(d.jobs||[]).filter(j=>!j.error).sort(byName);
  if(d.detail)DETAIL=d.detail;
  if(d.title){document.getElementById("ttl").textContent=d.title;document.title="Nexus – "+d.title}
  if(d.published_at)document.getElementById("sub").textContent="Read-only view · updated "+d.published_at.replace("T"," ");
  else document.getElementById("sub").textContent=MODE==="preview"?"Preview (how other departments see it)":"Read-only view";
  TAB=hasMW()?"mywork":"jobs";renderShell();
}

// ---------------------------------------------------------------- login
function showLogin(){
  const el=document.createElement("div");el.id="loginwrap";
  el.innerHTML=`<form class="loginbox" onsubmit="doLogin(event);return false">
    <div class="logo"><img src="${LOGIN_LOGO}" alt="Nexus"></div>
    <h2>Document Status</h2><p class="s">Please sign in to view</p>
    <div class="loginerr" id="lerr"></div>
    <div class="fld"><label>Username</label><input id="lu" autocomplete="username" autofocus></div>
    <div class="fld"><label>Password</label><input id="lp" type="password" autocomplete="current-password"><span class="eye" onclick="togPw()">show</span></div>
    <button class="loginbtn" id="lbtn">Sign in</button>
    </form>`;
  document.body.appendChild(el);document.title="Nexus – Sign in";
}
function togPw(){const i=document.getElementById("lp"),e=event.target;if(i.type==="password"){i.type="text";e.textContent="hide"}else{i.type="password";e.textContent="show"}}
async function doLogin(ev){ev&&ev.preventDefault();
  const u=document.getElementById("lu").value.trim(),p=document.getElementById("lp").value,er=document.getElementById("lerr"),b=document.getElementById("lbtn");
  if(!u||!p){er.textContent="Enter username and password.";er.style.display="block";return}
  b.disabled=true;b.textContent="Checking…";er.style.display="none";
  try{
    if(MODE==="user"){
      const r=await post("/api/u/login",{username:u,password:p});
      TOKEN=r.token;USERNAME=r.username;JOBS=(r.data.jobs||[]).filter(j=>!j.error).sort(byName);DETAIL=r.data.detail||{};
      MYWORK=norm(r.mywork);EDIT=true;CANOPEN=true;CANONLINE=!!r.can_online;
      if(r.data.title){document.getElementById("ttl").textContent=r.data.title;document.title="Nexus – "+r.data.title}
      document.getElementById("sub").textContent="Signed in · you can edit your My Work and open files";
    }else{
      const payload=await tryLogin(LOCK,u,p);
      if(!payload){throw new Error("bad")}
      USERNAME=u;JOBS=(payload.jobs||[]).filter(j=>!j.error).sort(byName);DETAIL=payload.detail||{};
      MYWORK=norm(await loadGithubMyWork(payload,u,p));EDIT=false;CANOPEN=false;CANONLINE=false;
      if(payload.title){document.getElementById("ttl").textContent=payload.title;document.title="Nexus – "+payload.title}
      if(payload.published_at)document.getElementById("sub").textContent="Read-only · updated "+payload.published_at.replace("T"," ");
    }
  }catch(e){er.textContent=(e&&e.message&&e.message!=="bad")?e.message:"Wrong username or password.";er.style.display="block";b.disabled=false;b.textContent="Sign in";document.getElementById("lp").select();return}
  const w=document.getElementById("loginwrap");if(w)w.remove();
  TAB="mywork";renderShell();
}
function norm(mw){mw=mw||{};if(!mw.watch)mw.watch={};return mw}
async function loadGithubMyWork(payload,user,pw){
  const uc=payload.uc;if(!uc||!uc.user_repo)return {watch:{}};
  try{const saltB=_u8(uc.user_salt);
    const tag=(await hmacHex(saltB,"tag:"+user.toLowerCase())).slice(0,24);
    const key=await _ukey(pw,user,saltB,LOCK.it);
    const r=await fetch(`https://raw.githubusercontent.com/${uc.owner}/${uc.user_repo}/main/${tag}.json?v=`+Date.now(),{cache:"no-store"});
    if(!r.ok)return {watch:{}};
    const blob=await r.json(),pt=await _dec(key,blob.data);
    return pt?JSON.parse(new TextDecoder().decode(pt)):{watch:{}};
  }catch(e){return {watch:{}}}
}
function logout(){location.reload()}

// ---------------------------------------------------------------- shell / tabs
function renderShell(){
  const who=document.getElementById("who");
  who.innerHTML=hasMW()?`Signed in as <b>${esc(USERNAME)}</b> <a class="lo" onclick="logout()">Sign out</a>`:"";
  const tb=document.getElementById("tabsbar");
  if(hasMW()){tb.style.display="flex";const n=Object.keys(MYWORK.watch).length;
    tb.innerHTML=`<a class="${TAB==="mywork"?"on":""}" onclick="setTab('mywork')">My Work${n?` <span class="cnt" style="background:var(--accent2)">${n}</span>`:""}</a>
      <a class="${TAB==="jobs"?"on":""}" onclick="setTab('jobs')">All Jobs</a>`;
  }else tb.style.display="none";
  render();
}
function setTab(t){TAB=t;curJob=null;renderShell()}
function render(){
  const a=document.getElementById("app");
  if(TAB==="mywork"&&hasMW())return renderMyWork(a);
  renderJobs(a);
}

// ---------------------------------------------------------------- My Work
function myItems(){return Object.entries(MYWORK.watch).map(([k,v])=>{const [jid,doc]=k.split("|");const d=liveDoc(jid,doc);return {k,jid,doc,v,d}})}
function renderMyWork(a){
  const items=myItems();
  const alerts=items.filter(x=>alertTxt(x).length);
  const dueSoon=items.filter(x=>autoAlert(x.d));
  const mine=items.filter(x=>myAlert(x.v));
  const pend=items.filter(x=>x.d&&x.d.status==="Approval Pending");
  let html="";
  if(EDIT)html+=`<div class="savebar"><span id="savestate">${DIRTY?"Saving…":LASTSAVE?"All changes saved ✓":"Your changes save automatically on this PC."}</span>
     ${CANONLINE?`<button class="btn sm" onclick="updateOnline(this)">Update online</button><span class="small muted">so you can see this list on the web link too</span>`:`<span class="small muted">Online sync is not set up yet.</span>`}</div>`;
  html+=`<h2>My Work</h2><div class="sub">${items.length} document(s) in your list. You're alerted 2 days before a response is due, and 1 day before your own reminder.</div>
   <div class="todo">
    <div class="box"><h4>⏰ Alerts now</h4><div class="n due-over">${alerts.length}</div></div>
    <div class="box"><h4>Response due ≤ 2 days</h4><div class="n due-soon">${dueSoon.length}</div></div>
    <div class="box"><h4>My reminders</h4><div class="n">${mine.length}</div></div>
    <div class="box"><h4>Approval pending</h4><div class="n">${pend.length}</div></div></div>`;
  if(alerts.length)html+=`<div class="alerts">${alerts.map(x=>`<div class="al"><b>${esc(x.d?x.d.title||x.doc:x.doc)}</b> <span class="small muted">${esc(jobName(x.jid))}</span><div class="small">${alertTxt(x).map(esc).join(" · ")}</div></div>`).join("")}</div>`;
  if(!items.length){html+=`<div class="empty">Nothing here yet. Go to <b>All Jobs</b>, open a job and press <b>+ My Work</b> on any document.</div>`;a.innerHTML=html;return}
  // status filter
  const counts={};items.forEach(x=>{const s=x.d?x.d.status:"(removed)";counts[s]=(counts[s]||0)+1});
  html+=`<div class="toolbar"><span class="seg"></span>`;
  const chip=(id,lbl,n)=>`<span class="pill ${MF===id?"":""}" style="cursor:pointer;${MF===id?"outline:2px solid var(--accent2)":""}" onclick="MF='${id}';render()">${lbl}${n!=null?" "+n:""}</span>`;
  html+=chip("all","All",items.length);
  CARDS.forEach(([l,sts])=>{const n=items.filter(x=>x.d&&sts.includes(x.d.status)).length;if(n)html+=" "+chip(l,l,n)});
  html+=`&nbsp;<input type="search" placeholder="Search doc, title, note" value="${esc(MQ)}" oninput="MQ=this.value;render()"></div>`;
  let list=items;
  if(MF!=="all"){const c=CARDS.find(x=>x[0]===MF);const sts=c?c[1]:[MF];list=list.filter(x=>x.d&&sts.includes(x.d.status))}
  if(MQ){const q=MQ.toUpperCase();list=list.filter(x=>x.doc.toUpperCase().includes(q)||(x.d&&(x.d.title||"").toUpperCase().includes(q))||(x.v.note||"").toUpperCase().includes(q))}
  list.sort((x,y)=>(y.v.pin?1:0)-(x.v.pin?1:0)||(x.v.remind||"9999").localeCompare(y.v.remind||"9999")||jobName(x.jid).localeCompare(jobName(y.jid)));
  html+=list.map(mwRowHtml).join("")||`<div class="empty">No documents match.</div>`;
  a.innerHTML=html;
}
function mwRowHtml(x){
  const d=x.d,st=d?d.status:"(removed)";
  const days=d&&d.days!=null?`<span class="${d.flag?"flag":""}">${d.days}</span>/${d.due??"–"} d`:"";
  const remClass=x.v.remind?(x.v.remind<today()?"due-over":x.v.remind<=addDays(7)?"due-soon":""):"";
  const al=alertTxt(x);
  return `<div class="mwrow ${x.v.pin?"pinned":""}">
    <div class="top">
      ${EDIT?`<span class="pin ${x.v.pin?"on":""}" title="${x.v.pin?"Unpin":"Pin to top"}" onclick="togPin('${esc(x.k)}')">📌</span>`:(x.v.pin?`<span class="pin on">📌</span>`:"")}
      ${d?pill(st):`<span class="pill">${st}</span>`}
      ${days?`<span class="small">${days}</span>`:""}
      <span class="small muted">${esc(jobName(x.jid))}</span>
      <span style="flex:1"></span>
      ${d&&CANOPEN&&folderOf(d)?`<button class="btn sm" onclick="openDoc('${x.jid}','${esc(folderOf(d))}',1)">Open folder</button>`:""}
      ${EDIT?`<button class="btn sm" onclick="unwatch('${esc(x.k)}')">Remove</button>`:""}
    </div>
    ${al.length?`<div class="badge">⏰ ${al.map(esc).join(" · ")}</div>`:""}
    <div class="mt">${d?esc(d.title||""):"No longer in the document list"}</div>
    <div class="doc mdn">${esc(x.doc)}</div>
    <div class="top" style="margin-top:7px">
      <label class="small muted">My reminder <input type="date" class="mini" value="${esc(x.v.remind||"")}" ${EDIT?"":"disabled"} onchange="setRem('${esc(x.k)}',this.value)"></label>
      ${x.v.remind?`<button class="btn sm" onclick="addIcs('${esc(x.doc)}','${esc((d&&d.title)||x.doc)}','${x.v.remind}')">Add to Outlook</button>`:""}
      ${x.v.remind?`<span class="small ${remClass}">${x.v.remind<today()?"Reminder passed":"Alert from "+dmy(addDaysTo(x.v.remind,-1))}</span>`:""}
      ${d&&dueDate(d)?`<span class="small muted">· Response due ${dmy(dueDate(d))} (alert from ${dmy(addDaysTo(dueDate(d),-2))})</span>`:""}
    </div>
    ${EDIT?`<textarea class="note" rows="2" placeholder="Personal note…" onchange="setNote('${esc(x.k)}',this.value)">${esc(x.v.note||"")}</textarea>`
          :(x.v.note?`<div class="note" style="background:#fafbfc">${esc(x.v.note)}</div>`:"")}
  </div>`;
}
function folderOf(d){const e=d.last_rec||d.last_sub;return e&&e.file?e.file:""}
function addDaysTo(iso,n){const t=new Date(iso+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function addDays(n){return addDaysTo(today(),n)}
function recentlyChanged(d){const e=d.last_rec||d.last_sub;if(!e||!e.date)return false;return e.date>=addDaysPast(7)}
function addDaysPast(n){return addDaysTo(today(),-n)}
// edits
function togWatch(jid,doc){const k=wkey(jid,doc);if(MYWORK.watch[k])delete MYWORK.watch[k];else{MYWORK.watch[k]={};const d=liveDoc(jid,doc),dd=d?dueDate(d):null;toast(dd?"Added to My Work · you'll be alerted 2 days before the response is due ("+dmy(dd)+")":"Added to My Work")}touch();renderShell()}
function dueDate(d){if(d.due==null||d.days==null)return null;return addDaysTo(today(),d.due-d.days)}
function daysTo(iso){return Math.round((new Date(iso+"T00:00:00Z")-new Date(today()+"T00:00:00Z"))/864e5)}
function autoAlert(d){const dd=d?dueDate(d):null;if(!dd)return null;const n=daysTo(dd);return n<=2?{n,dd}:null}          // 2 days before response due
function myAlert(v){if(!v||!v.remind)return null;const n=daysTo(v.remind);return n<=1?{n}:null}                        // 1 day before personal reminder
function alertTxt(x){const out=[];const a=autoAlert(x.d),m=myAlert(x.v);
  if(a)out.push(a.n<0?`Response overdue by ${-a.n} day(s)`:a.n===0?"Response due today":`Response due in ${a.n} day(s)`);
  if(m)out.push(m.n<0?`Your reminder was ${-m.n} day(s) ago`:m.n===0?"Your reminder is today":"Your reminder is tomorrow");
  return out}
function mwBtn(id,doc){const inw=!!MYWORK.watch[wkey(id,doc)];
  if(!EDIT)return inw?`<span class="pill" style="background:#e8f5e9;color:var(--green)">✓ In My Work</span>`:"";
  return `<button class="mwbtn ${inw?"on":""}" onclick="event.stopPropagation();togWatch('${id}','${esc(doc)}')">${inw?"✓ In My Work":"+ My Work"}</button>`}
function unwatch(k){delete MYWORK.watch[k];touch();render();renderShell()}
function togPin(k){const w=MYWORK.watch[k];if(w){w.pin=!w.pin;touch();render()}}
function setRem(k,v){if(MYWORK.watch[k]){MYWORK.watch[k].remind=v;touch();render()}}
function setNote(k,v){if(MYWORK.watch[k]){MYWORK.watch[k].note=v;touch()}}
function touch(){if(!EDIT)return;DIRTY=true;const s=document.getElementById("savestate");if(s)s.textContent="Saving…";clearTimeout(saveT);saveT=setTimeout(saveNow,700)}
async function saveNow(){if(MODE!=="user")return;try{await post("/api/u/mywork",{mywork:MYWORK});DIRTY=false;LASTSAVE=new Date();}catch(e){toast(e.message,1)}const s=document.getElementById("savestate");if(s)s.textContent=DIRTY?"Saving…":"All changes saved ✓"}
async function updateOnline(btn){btn.disabled=true;btn.textContent="Updating…";try{await saveNow();await post("/api/u/publish",{mywork:MYWORK});toast("Saved online. It shows on the web link in 1–2 minutes.");}catch(e){toast(e.message,1)}btn.disabled=false;btn.textContent="Update online"}
async function openDoc(jid,file,folder){if(!CANOPEN)return;try{await post("/api/u/open",{job_id:jid,file:file,folder:!!folder})}catch(e){toast(e.message,1)}}
function addIcs(doc,title,date){const dt=date.replace(/-/g,"");const b=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Nexus//EN","BEGIN:VEVENT","UID:"+doc+"-"+dt+"@nexus","DTSTART;VALUE=DATE:"+dt,"SUMMARY:Nexus reminder: "+title,"DESCRIPTION:"+doc,"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+doc,"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");const a=document.createElement("a");a.href="data:text/calendar;base64,"+btoa(unescape(encodeURIComponent(b)));a.download="reminder.ics";a.click()}

// ---------------------------------------------------------------- All Jobs browse
function renderJobs(a){
  if(curJob)return renderJob(a,curJob);
  a.innerHTML=`<h2>All Jobs</h2><div class="cards">`+JOBS.map(j=>{const c=j.counts||{},t=j.total||0;return `<div class="card" onclick="openJobView('${j.id}')">
    <h3>${esc(j.name)}</h3><div class="small muted">${t} documents${c["Approval Pending"]?` · <span class="flag">${c["Approval Pending"]} approval pending</span>`:""}</div>
    <div class="bar">${ST.map(s=>c[s]?`<div title="${s}: ${c[s]}" style="width:${100*c[s]/t}%;background:${COL[s]}"></div>`:"").join("")}</div>
    <div class="small">${ST.filter(s=>c[s]).map(s=>`<span class="pill ${cls(s)}">${c[s]} ${esc(s)}</span>`).join(" ")}</div></div>`}).join("")+`</div>`;
}
async function openJobView(id){
  curJob=id;
  if(!DETAIL[id]){try{DETAIL[id]=MODE==="preview"?await get("/api/view/job/"+id):await get("data/job_"+id+".json")}catch(e){toast("Could not open job",1)}}
  render();
}
function renderJob(a,id){
  const J=DETAIL[id]||{rows:[]},c=J.counts||{};
  const k=(f,n,l,col)=>`<div class="kpi ${JF===f?"on":""}" style="border-left-color:${col}" onclick="JF='${f}';render()"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  a.innerHTML=`<div class="toolbar"><button class="btn sm" onclick="curJob=null;render()">← All jobs</button></div>
   <h2>${esc(J.name||jobName(id))}</h2><div class="sub">Status as of ${esc((J.updated_at||"").replace("T"," "))}</div>
   <div class="kpis">${k("all",J.total,"All documents","var(--accent2)")}${CARDS.map(([l,sts])=>k(l,cardN(c,sts),l,COL[sts[0]])).join("")}</div>
   <div class="toolbar"><input type="search" placeholder="Search document no., title or file name" value="${esc(JQ)}" oninput="JQ=this.value;jobRows()">${EDIT?`<span class="small muted">Press <b>+ My Work</b> to add a document to your list.</span>`:""}</div>
   <div class="wrap"><table><thead><tr><th>#</th><th>Document No</th><th>Title</th><th>Status</th><th>Days</th><th>Rev</th>${hasMW()?"<th>My Work</th>":""}<th>Last submitted</th><th>Last client reply</th></tr></thead><tbody id="jr"></tbody></table></div>
   <div class="dcards" id="jc"></div>`;
  jobRows();
}
function evCell(e){if(!e)return"";return `${dmy(e.date)} · R${esc(e.rev)} ${e.status?pill(e.status):""}${e.tn?`<div class="small muted">TN ${esc(e.tn)}</div>`:""}${e.file?`<div class="file">📄 ${esc(e.file)}</div>`:""}`}
function jobRows(){
  const id=curJob,J=DETAIL[id]||{rows:[]};let rows=J.rows||[];
  if(JF!=="all"){const cc=CARDS.find(x=>x[0]===JF);const sts=cc?cc[1]:[JF];rows=rows.filter(r=>sts.includes(r.status))}
  if(JQ){const q=JQ.toUpperCase();rows=rows.filter(r=>r.doc_no.toUpperCase().includes(q)||(r.title||"").toUpperCase().includes(q)||(r.history||[]).some(h=>(h.file||"").toUpperCase().includes(q)))}
  const mw=hasMW(),ncol=mw?9:8;
  const days=r=>r.days!=null?`<span class="${r.flag?"flag":""}">${r.days}</span>/${r.due??"–"} d`:"";
  const hist=r=>`<table><thead><tr><th>Date</th><th>Rev</th><th>Status</th><th>Transmittal</th><th>File name</th></tr></thead><tbody>
      ${(r.history||[]).map(h=>`<tr><td>${dmy(h.date)}</td><td>R${esc(h.rev)}</td><td>${pill(h.status)}</td><td>${esc(h.tn||"")}</td><td class="file">${esc(h.file||"–")}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Nothing yet.</td></tr>`}</tbody></table>
      ${CANOPEN&&folderOf(r)?`<div style="margin-top:6px"><button class="btn sm" onclick="openDoc('${id}','${esc(folderOf(r))}',1)">Open folder</button></div>`:""}`;
  document.getElementById("jr").innerHTML=rows.map(r=>{const o=`onclick="tog('${esc(r.doc_no)}')"`;return `<tr class="r">
    <td class="muted" ${o}>${r.sr}</td><td class="doc" ${o}>${esc(r.doc_no)}</td><td ${o}>${esc(r.title)}</td>
    <td ${o}>${pill(r.status)}</td><td class="small" ${o} style="white-space:nowrap">${days(r)}</td>
    <td ${o}>${r.latest_rev?"R"+esc(r.latest_rev):""}</td>${mw?`<td>${mwBtn(id,r.doc_no)}</td>`:""}
    <td class="small" ${o}>${evCell(r.last_sub)}</td><td class="small" ${o}>${evCell(r.last_rec)}</td></tr>
    ${JOPEN[r.doc_no]?`<tr class="hist"><td colspan="${ncol}">${hist(r)}</td></tr>`:""}`}).join("")||`<tr><td colspan="${ncol}" class="empty">No documents match.</td></tr>`;
  const ev=(lbl,e)=>e?`<div class="ev"><b>${lbl}</b> ${dmy(e.date)} · R${esc(e.rev)} ${e.status?pill(e.status):""}${e.tn?` · TN ${esc(e.tn)}`:""}${e.file?`<div class="file">📄 ${esc(e.file)}</div>`:""}</div>`:"";
  document.getElementById("jc").innerHTML=rows.map(r=>`<div class="dcard">
    <div class="meta"><span class="muted">#${r.sr}</span>${pill(r.status)}${r.latest_rev?`<span>R${esc(r.latest_rev)}</span>`:""}${r.days!=null?`<span>${days(r)}</span>`:""}</div>
    <div class="t">${esc(r.title)}</div><div class="dn">${esc(r.doc_no)}</div>
    ${ev("Submitted",r.last_sub)}${ev("Client reply",r.last_rec)}
    <div class="acts">${mw?mwBtn(id,r.doc_no):""}<button class="btn sm" onclick="tog('${esc(r.doc_no)}')">${JOPEN[r.doc_no]?"Hide history":"History"}</button></div>
    ${JOPEN[r.doc_no]?`<div class="hist" style="margin-top:8px;overflow-x:auto">${hist(r)}</div>`:""}
  </div>`).join("")||`<div class="empty">No documents match.</div>`;
}
function tog(d){JOPEN[d]=!JOPEN[d];jobRows()}
init();

</script>
</body>
